services:
  - type: keyvalue
    name: sf-rule-switch-redis
    plan: free
    ipAllowList: []

  - type: web
    name: sf-rule-switch-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm run start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: FRONTEND_REDIRECT_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sf-rule-switch-redis
          property: connectionString
      - key: SALESFORCE_CLIENT_ID
        sync: false
      - key: SALESFORCE_CLIENT_SECRET
        sync: false
      - key: SALESFORCE_REDIRECT_URI
        sync: false
      - key: SALESFORCE_LOGIN_URL
        value: https://login.salesforce.com
      - key: SALESFORCE_API_VERSION
        value: v61.0

  - type: web
    name: sf-rule-switch-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
